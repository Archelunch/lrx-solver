[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrx-lab"
version = "0.1.0"
description = "Exact computation and LLM-guided search for the LRX multiset sorting-radius conjecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michelle Pavlukhin", email = "alivemihail@gmail.com"}]
keywords = ["cayley graph", "schreier graph", "permutation sorting", "LRX", "program search"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
lift = ["numpy>=1.24"]

[project.scripts]
lrx = "lrx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lrx = ["report_head.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
