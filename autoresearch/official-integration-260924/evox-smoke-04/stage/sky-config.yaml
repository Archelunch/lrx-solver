{
  "max_iterations": 3,
  "checkpoint_interval": 1,
  "log_level": "DEBUG",
  "language": "python",
  "llm": {
    "models": [
      {
        "name": "grok-4.7",
        "weight": 1.0
      }
    ],
    "api_base": "http://127.0.0.1:8766/v1",
    "api_key": "local-broker",
    "max_tokens": 4000,
    "temperature": 0.7,
    "timeout": 120,
    "retries": 0
  },
  "search": {
    "type": "evox",
    "num_context_programs": 2,
    "database": {
      "auto_generate_variation_operators": true
    },
    "switch_interval": 1,
    "share_llm": true
  },
  "prompt": {
    "system_message": "Find constructive LRX sorting algorithms. Candidate source must define propose_words(case), accepting a dict with m, labels, mask, id, blocks and returning a finite list of strings over L,R,X. Use only Python's standard library. Every returned word is independently replayed and scored. An absent word is a failed search, never a distance lower bound. Do not read files, the network, environment variables, or hidden examples."
  },
  "evaluator": {
    "timeout": 120,
    "max_retries": 0,
    "cascade_evaluation": false
  },
  "diff_based_generation": true,
  "max_solution_length": 40000,
  "monitor": {
    "enabled": false
  }
}
