ficients: degree<=3 polynomials in (a,b,c,m) plus step/indicator terms at the kappa thresholds, and q times those steps, fit m=4..8 exactly but failed at the first untried m=9 (about 1200 violated rows). The bottleneck is triples with a unit gap (b-a==1 or c-b==1); freeing only those triples' coefficients from the polynomial made the fit exact through m=10, so unit-gap triples need dependence the low-degree polynomials could not express. In the infeasibility structure, about 60% of the violation mass sits on wrapping rows (q+t>m) and about a third at the equality-order row q=m-(b-a); the heaviest gap classes are (b-a,c-b) in {(1,1),(1,2),(2,1),(1,3)}. This does not prescribe a fix; possibilities worth exploring include triple potentials depending on min/max of the gaps, floor/mod expressions, or piecewise definitions with breakpoints tied to both q and m-q. Every known epsilon=0 certificate is tight at the reversal-order rows q=m-(b-a) and (m-(b-a), m-(c-b)). coefficients(m) may compute its output algorithmically for the given m (loops, or a small exact linear solve restricted to the known-tight rows, are fine); it must stay standard-library and finish within 10 seconds per m regardless of method. A construction with a human-checkable argument for why it holds for every m is worth more than a lookup table over development m; the holdout set tests m your program has never seen. Do not read files, the network, or environment variables."
